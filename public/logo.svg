<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 471" width="1600" height="471">
  <defs>
    <style>
      .bold-text { font-family: "Hiragino Kaku Gothic ProN", "Meiryo", "BIZ UDPGothic", "Yu Gothic", sans-serif; font-weight: 900; }
      .mincho-text { font-family: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif; font-weight: 900; }
      .en-text { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; font-weight: 900; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="471" rx="28" fill="#ffffff" />

  <!-- Top Left: Station Number (JY 06) -->
  <rect x="70" y="45" width="126" height="135" rx="20" fill="#ffffff" stroke="#111111" stroke-width="7" />
  <text x="133" y="100" class="en-text" font-size="36" fill="#111111" text-anchor="middle">JY</text>
  <text x="133" y="162" class="en-text" font-size="58" fill="#111111" text-anchor="middle">06</text>

  <!-- Center Title: 鶯 谷 杯 -->
  <g transform="translate(800, 130)">
    <text x="0" y="0" class="mincho-text" font-size="124" fill="#050505" text-anchor="middle" letter-spacing="24">鶯 谷 杯</text>
    <text x="0" y="44" class="bold-text" font-size="34" fill="#111111" text-anchor="middle" letter-spacing="10">うぐいすだにカップ</text>
  </g>

  <!-- Top Right: Yamanote Badge (山 区) -->
  <rect x="1404" y="55" width="126" height="110" rx="14" fill="#ffffff" stroke="#111111" stroke-width="6" />
  <rect x="1412" y="63" width="110" height="94" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2" />
  <text x="1467" y="130" class="bold-text" font-size="46" fill="#111111" text-anchor="middle" letter-spacing="6">山 区</text>

  <!-- Middle Bar: Yamanote Green with Arrows -->
  <g transform="translate(0, 212)">
    <!-- Base Green Chevron Arrow Bar -->
    <path d="M 60 0 L 1540 0 L 1500 37 L 1540 74 L 60 74 L 20 37 Z" fill="#24843d" />
    
    <!-- Center Lime Accent Block -->
    <rect x="765" y="0" width="70" height="74" fill="#8dc63f" />

    <!-- Bar Label Right: @京都 -->
    <text x="1350" y="54" class="bold-text" font-size="48" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">@京都</text>
  </g>

  <!-- Bottom Row -->
  <!-- Left Date -->
  <text x="75" y="348" class="en-text" font-size="48" fill="#111111" letter-spacing="2">2026</text>
  <text x="75" y="394" class="en-text" font-size="38" fill="#111111" letter-spacing="1">Oct.11</text>

  <!-- Center English -->
  <text x="800" y="380" class="en-text" font-size="62" fill="#111111" text-anchor="middle" letter-spacing="2">Uguisudani Cup</text>

  <!-- Right: Kyoto JY 07 -->
  <g transform="translate(1320, 335)">
    <text x="70" y="48" class="en-text" font-size="38" fill="#111111" text-anchor="end">Kyoto</text>
    <rect x="90" y="2" width="64" height="68" rx="12" fill="#ffffff" stroke="#111111" stroke-width="5" />
    <text x="122" y="30" class="en-text" font-size="18" fill="#111111" text-anchor="middle">JY</text>
    <text x="122" y="60" class="en-text" font-size="28" fill="#111111" text-anchor="middle">07</text>
  </g>
</svg>
